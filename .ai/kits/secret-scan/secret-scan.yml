name: Secret Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download scanner
        run: docker pull "$GITLEAKS_IMAGE"

      - name: Scan source code and Git history
        shell: bash
        run: |
          failed=0
          scan() {
            local label="$1"
            shift
            if docker run --rm --network none \
                -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
                -e GIT_CONFIG_COUNT=1 \
                -e GIT_CONFIG_KEY_0=safe.directory \
                -e GIT_CONFIG_VALUE_0=/repo \
                "$GITLEAKS_IMAGE" "$@" \
                --redact=100 --verbose --no-color --exit-code=10; then
              echo "PASS: $label"
            else
              rc=$?
              if [ "$rc" -eq 10 ]; then
                echo "::error title=SECRET DETECTED::$label - Possible exposed credential."
              else
                echo "::error title=SCAN FAILED::$label - Scanner error ($rc)."
              fi
              failed=1
            fi
          }
          scan "Source code" dir /repo --max-archive-depth=2 --max-decode-depth=2
          scan "Git history" git /repo --log-opts="--all HEAD -m" --max-archive-depth=2 --max-decode-depth=2
          exit "$failed"
